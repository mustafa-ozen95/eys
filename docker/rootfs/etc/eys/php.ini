; Panel için PHP ayarları — hem fpm hem cli.
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 32M
expose_php = Off
date.timezone = Europe/Istanbul

; Günlük konteyner çıktısına gider; dosyaya yazılmaz.
log_errors = On
error_log = /dev/stderr
display_errors = Off

; OPcache: üretim ayarları. Kod imajda sabittir, dosya zamanı kontrol edilmez.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
