# Yalnız düz HTTP (80; cihaz arayüzü kökeni aşağıda 9080). TLS'i önündeki
# vekil bitirir: platformun kendisi (NineDeploy/Traefik, Coolify...) ya da
# Caddy/nginx. Panel isteğin HTTPS olduğunu vekilin X-Forwarded-Proto
# başlığından bilir (bootstrap/app.php → trustProxies).
server {
    listen 80 default_server;

    server_name _;

    root /uygulama/public;
    index index.php;

    charset utf-8;

    # --- SSH WebSocket vekili -------------------------------------------------
    # ttyd'nin KENDİ kimlik doğrulaması yoktur. Bu kontrol olmadan, açık bir
    # oturum sırasında port aralığını tarayan kimliksiz biri terminale
    # düşebilir. Laravel her istekte oturum sahibini ve bağlanma yetkisini
    # yeniden sorar.
    #
    # Aralık "if" ile DEĞİL konum deseninde sınırlanır: if bloğu adlandırılmış
    # yakalamayı alt isteğe taşımıyor.
    #
    # Desen config/remote.php → ttyd.port_range (7500-7699) ile BİREBİR
    # eşleşmek zorundadır.
    location ~ ^/ssh-proxy/(?<ttyd_port>7[56][0-9][0-9])(?<path>/.*)?$ {
        auth_request /uzak-oturum-bekcisi;

        proxy_pass http://127.0.0.1:$ttyd_port$path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/ssh-proxy/ {
        return 403;
    }

    # --- RDP vekili (Guacamole) ----------------------------------------------
    # Guacamole'un kendi jetonu var; bu kontrol panel oturumunu da şart koşar.
    location ^~ /rdp-proxy/ {
        auth_request /uzak-oturum-bekcisi;

        proxy_pass http://127.0.0.1:8090/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Statik varlıklar ve çerezler doğru dizinden çalışsın.
        proxy_cookie_path /guacamole/ /rdp-proxy/;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Cihaz arayüzü vekili -------------------------------------------------
    # ESXi Host Client ve vCenter appliance yönetimi (VAMI) arayüzlerinin
    # oturumu DIŞARIDAN açılamıyor: ESXi her SOAP çağrısına istemcinin
    # ürettiği bir CSRF jetonu koyup oturumu ona bağlıyor, VAMI oturum
    # jetonunu localStorage'da tutuyor. İkisi de başka bir kökenden
    # kurulamaz (ölçümler app/Services/DeviceInterface/InterfaceType.php).
    #
    # Bu yüzden arayüzün KENDİSİ buradan servis edilir. Çerez de localStorage
    # da panelin kökeninde olunca giriş tutuyor.
    #
    # HEDEF İSTEKTEN DEĞİL BEKÇİDEN gelir (X-Eys-Hedef). İstek başlığına
    # güvenilseydi panel, istenen her adrese bağlanan açık bir vekile dönerdi.
    #
    # Adresler config/remote.php → remote.arayuz.prefix ve
    # InterfaceType::kokYollari() ile BİREBİR aynı olmalı.
    location ~ "^/cihaz-oturum/[0-9a-f-]{36}/$" {
        # Giriş sayfası CİHAZDAN alınır ama açılış betiği eklenerek; o işi
        # Laravel yapıyor (bkz. InterfaceSessionController::sayfa).
        try_files $uri /index.php?$query_string;
    }

    # Devir: anlık jetonu harcayıp vekil kökenine çerezi kuran uç.
    location ~ "^/cihaz-oturum/devir/[0-9a-f-]{36}$" {
        try_files $uri /index.php?$query_string;
    }

    # Panelin kendi verdiği iki dosya: tek kullanımlık kimlik ve açılış betiği.
    # Betik AYRI dosyadır çünkü cihazların Güvenlik İlkesi satır içi betiği
    # reddediyor; aynı kökenden geleni kabul ediyor.
    # Panelin kendi verdiği iki dosya: tek kullanımlık kimlik ve açılış betiği.
    # Betik AYRI dosyadır çünkü cihazların Güvenlik İlkesi satır içi betiği
    # reddediyor; aynı kökenden geleni kabul ediyor.
    location ~ "^/cihaz-oturum/[0-9a-f-]{36}/(kimlik|acilis\.js)$" {
        try_files $uri /index.php?$query_string;
    }

    location ~ "^/cihaz-oturum/[0-9a-f-]{36}/(?<arayuz_yol>.+)$" {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_taban $upstream_http_x_eys_taban;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        proxy_pass https://$arayuz_havuz$arayuz_taban$arayuz_yol$is_args$args;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    # Arayüzlerin KÖKTEN istediği yollar. Adresleri arayüzün içinde SABİT:
    # ESXi vekil kipinde SOAP'ı /sdk'ya, karşılama metnini /ui/ altına atıyor;
    # VAMI bütün REST çağrılarını /rest/ altına atıyor.
    #
    # /sdk'da ÖNEK eşleşmesi şart: istemci /sdk/vimService.wsdl dosyasını da
    # istiyor ve tam eşleşmede o istek panele düşüp 404 alır ("Please
    # refresh your browser").
    location ^~ /sdk {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        # Çağrının bir KOPYASI kayda gider. Ayna asıl isteği BEKLETMEZ ve
        # yanıtı yok sayılır: denetim kaydı tutmak arayüzü yavaşlatmamalı,
        # oradaki bir hata da cihaz erişimini kesmemeli.
        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    location ^~ /ui/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    location ^~ /rest/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        # VAMI'de "yapılan iş" çağrının kendisidir: yöntem ve yol.
        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    # vCenter'ın TEK OTURUM AÇMA ucu. Arayüz kimlik akışında buraya kökten
    # gidiyor; taban dizinine çevrilirse /ui/websso/ olur ve akış kırılır.
    # InterfaceType::kokYollari() bu yolu sayar; karşılığı olan konum burasıdır.
    location ^~ /websso/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        # VAMI'de "yapılan iş" çağrının kendisidir: yöntem ve yol.
        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    # VM KONSOLUNUN CANLI BAĞLANTISI. vCenter 8 konsolu kendi üzerinden
    # geçiriyor: arayüz /ui/webconsole-ticket'tan bir ROTA alıyor ve konsolu o
    # rotaya bağlıyor. Rota cihazın KÖKÜNDE duruyor; taban dizinine
    # çevrildiğinde /ui/webconsole-ticket/<rota> oluyor ve arayüzün bilet ucu
    # "An error occurred while retrieving the web console URL." döndürür.
    # Ekranda görünen ise yalnızca
    # "Couldn't establish a connection to the VM web console." olur.
    location ^~ /webconsole-ticket/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }
    include /etc/nginx/snippets/interface-watcher.conf;

    # --- Panel ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/eys.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # Portu geri kazandırır; gerekçe nginx.conf'taki map'te.
        fastcgi_param HTTP_HOST $host$istek_portu;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # index.php dışında hiçbir PHP dosyası doğrudan çalıştırılmaz.
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# =============================================================================
#  CİHAZ ARAYÜZÜ KÖKENİ (ayrı port)
# =============================================================================
#  Plesk, iLO ve vSphere Client arayüzleri KÖKÜ baştan aşağı kullanıyor
#  (/cp/, /modules/, /ui-library/, /html/, /json/, /websso/ ...). Bunları
#  panelin kökünde karşılamak, o arayüzlerin bütün adres uzayını tek tek sayıp
#  panelinkiyle çakışmamasını ummak olurdu. Ayrı bir kökende tek bir
#  "location /" yetiyor ve arayüz kendi adreslerini olduğu gibi kullanıyor.
#
#  Ayrı köken aynı zamanda ASIL GÜVENLİK KAZANCI: cihazın arayüzünden çıkan
#  betik panelin sayfalarını okuyamaz, panele oturum sahibi adına iş
#  yaptıramaz.
#
#  BURADA YOL ÖNEKİ YOK. Oturumu adres değil ÇEREZ taşıyor; arayüz kökte
#  duruyor. Panelin bu kökende verdiği tek şeyler /cihaz-oturum/ altındaki üç
#  uçtur (devir, kimlik, açılış betiği).
#
#  Ters vekil bu kapıyı ayrı bir portla açar (bkz. docker/interface-proxy.Caddyfile)
#  ve Host başlığına portu da yazar; panel mutlak adreslerini ondan üretiyor.
server {
    listen 9080;

    server_name _;

    root /uygulama/public;
    index index.php;

    charset utf-8;

    client_max_body_size 512m;

    #  YÖNLENDİRMELER GÖRELİ OLSUN.
    #
    #  Bu dinleyici düz HTTP konuşuyor (TLS'i ters vekil bitiriyor), bu yüzden
    #  nginx mutlak bir Location kurduğunda şemayı "http" yazıyor ve tarayıcı
    #  https kökenden düşer (ör. Plesk'te
    #  http://eys.ornek.test:9443/login.php). Göreli adres bu sorunu kökünden
    #  kaldırır: şemayı tarayıcı kendi bulur.
    absolute_redirect off;

    # Panelin bu kökende verdiği uçlar. Önek cihazın kendi adresleriyle
    # çakışmayacak kadar kendine özgü.
    # OTURUM ÖNEKLİ ADRES: /cihaz-oturum/<oturum>/<cihazın yolu>
    #
    # Oturumu yalnızca çerez taşıyamaz: çerez sekmeye değil TARAYICIYA ait.
    # Önek olmasa aynı anda iki arayüz açan kullanıcının istekleri son açılan
    # cihaza gider; iki Plesk'te ayıracak hiçbir ipucu kalmaz (iki arayüz aynı
    # anda açıkken birinde sayfa değişince öbürü hataya düşer).
    #
    # Önek altında GÖRELİ adresler kendiliğinden doğru çözülür. Cihazın MUTLAK
    # adresleri yine köke düşer; orada oturumu Referer söylüyor (bkz.
    # InterfaceProxyWatcher) — aynı kökende tarayıcı tam adresi gönderiyor.
    #
    # ÖNEK KAYDIN ADINI TAŞIR: /cihaz/ornek-panel/… Adres cihazı, çerez
    # kişiyi söylüyor; ikisi birlikte tek bir oturuma işaret ediyor. Panelin
    # kendi uçları AYRI önekte (/cihaz-oturum/) ve orada "^~" var — yoksa
    # sondaki genel kural onları da yutar ve devir ucu cihaza gider
    # (ekranda Plesk'in 404 sayfası).
    #
    # YOL BOŞ OLABİLİR: iniş adresi /cihaz/<kayıt>/ biçiminde ve cihazdaki
    # taban dizinini vekil ekliyor (X-Eys-Taban).
    location ~ "^/cihaz/[a-z0-9-]+/(?<arayuz_yol>.*)$" {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_taban $upstream_http_x_eys_taban;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz$arayuz_taban$arayuz_yol$is_args$args;
        include /etc/nginx/snippets/interface-proxy.conf;
    }
    location ^~ /cihaz-oturum/ {
        try_files $uri /index.php?$query_string;
    }

    # Arayüzün giriş sayfası KÖKTE. Cihazdan alınıp açılış betiği eklenerek
    # veriliyor; o işi Laravel yapıyor (InterfaceSessionController::sayfa).
    #
    # DOĞRUDAN ERİŞİM KAPALI (internal). Bu konum yalnızca /cihaz-oturum/
    # içindeki try_files yönlendirmesiyle çalışır. Dışarıdan /index.php/giris
    # gibi bir adres panelin kendi sayfalarını (giriş dahil) bu ayrı kökende
    # açmamalı; ayrı köken kurulmasının nedeni tam olarak bunu önlemek.
    location ~ ^/index\.php(/|$) {
        internal;
        fastcgi_pass unix:/run/php/eys.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param HTTP_HOST $host$istek_portu;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;



        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Arayüzlerin cihaz KÖKÜNDEN istediği sabit yollar. Bunlar arayüzün taban
    # dizinine göre DEĞİL, cihazın köküne göre çözülür; listesi
    # InterfaceType::kokYollari() ile birebir aynı olmalı.
    location ^~ /sdk {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    location ^~ /ui/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    location ^~ /rest/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    # vSphere Client'ın API GEÇİDİ. Yeni sihirbazlar (ör. "New Virtual
    # Machine" → Customize hardware) verilerini buradan çekiyor ve adres
    # cihazın KÖKÜNDE: /apigw. Taban dizinine çevrildiğinde /ui/apigw oluyor
    # ve vCenter 401 döndürür — ekranda "Error Loading Data … {"status":401}".
    location ^~ /apigw {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    # vSphere Client'ın GraphQL ucu; yine cihazın kökünde (/cp/graphql) ve
    # aynı sebeple taban dizinine çevrilmemeli.
    location ^~ /cp/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    # Geri kalan HER ŞEY arayüzün TABAN dizinine gider. ESXi'de o dizin /ui/,
    # ötekilerde kök; hangisi olduğunu bekçi söylüyor.
    #
    # YOL AÇIKÇA TAŞINIYOR. proxy_pass'te DEĞİŞKEN varsa nginx isteğin yolunu
    # hedefe EKLEMİYOR: "proxy_pass https://$hedef$taban" yazıldığında bütün
    # varlıklar aynı adrese gider ve arayüz boş açılır. Bu yüzden
    # konum düz önek değil YAKALAYAN bir düzenli ifadedir.
    location ~ "^/(?<arayuz_yol>.*)$" {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_taban $upstream_http_x_eys_taban;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz$arayuz_taban$arayuz_yol$is_args$args;
        include /etc/nginx/snippets/interface-proxy.conf;
    }

    # VM KONSOLUNUN CANLI BAĞLANTISI. vCenter 8 konsolu kendi üzerinden
    # geçiriyor: arayüz /ui/webconsole-ticket'tan bir ROTA alıyor ve konsolu o
    # rotaya bağlıyor. Rota cihazın KÖKÜNDE duruyor; taban dizinine
    # çevrildiğinde /ui/webconsole-ticket/<rota> oluyor ve arayüzün bilet ucu
    # "An error occurred while retrieving the web console URL." döndürür.
    # Ekranda görünen ise yalnızca
    # "Couldn't establish a connection to the VM web console." olur.
    location ^~ /webconsole-ticket/ {
        auth_request /arayuz-bekcisi;
        auth_request_set $arayuz_hedef $upstream_http_x_eys_hedef;
        auth_request_set $arayuz_cerez $upstream_http_x_eys_cerez;
        auth_request_set $arayuz_gizli $upstream_http_x_eys_gizli;
        auth_request_set $arayuz_konak $upstream_http_x_eys_konak;
        auth_request_set $arayuz_koken $upstream_http_x_eys_koken;

        mirror /arayuz-izleme;
        mirror_request_body on;

        proxy_pass https://$arayuz_havuz;
        include /etc/nginx/snippets/interface-proxy.conf;
    }
    include /etc/nginx/snippets/interface-watcher.conf;
}
