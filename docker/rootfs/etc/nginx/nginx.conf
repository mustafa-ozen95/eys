# Panelin kendi nginx'i. Konteyner düz HTTP dinler; önünde TLS'i bitiren bir
# ters vekil durur (örnek kural: docker/proxy.caddy).
user  eys;
worker_processes  auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 32m;

    # GELEN REFERER'IN YALNIZCA YOLU.
    #
    # Vekillenen arayüzler isteği KENDİ kökenlerinden gelmiş görmeli; bazıları
    # bunu denetliyor. DirectAdmin portalı her istekte bakıyor ve panelin
    # kökenini gördüğünde "Referer check has failed" diyor — giriş çalışsa bile
    # içinde gezilemez.
    #
    # Başlık cihazın kökeniyle yeniden kuruluyor; yol buradan geliyor
    # (bkz. snippets/interface-proxy.conf).
    map $http_referer $proxy_referer_path {
        default                        "";
        "~^https?://[^/]+(?<yol>/.*)$" $yol;
    }

    # Vekile giden Referer ve Origin.
    #
    # Bayrağı bekçi söylüyor (X-Eys-Origin). Eşleme, değişken ilk
    # KULLANILDIĞINDA çözülüyor — yani vekile geçerken — dolayısıyla
    # auth_request'ten sonra dolan değişkenleri görebiliyor. `if` bunu
    # yapamıyordu: o, rewrite aşamasında çalışıyor.
    #
    # Bayrak yoksa başlıklar TARAYICININ yazdığı gibi geçer.
    map $interface_origin $proxy_referer {
        default "$http_referer";
        "1"     "https://$interface_host$proxy_referer_path";
    }

    map $interface_origin $proxy_origin {
        default "$http_origin";
        "1"     "https://$interface_host";
    }

    # ---------------------------------------------------------------------
    #  HTTP_HOST'un PORTU
    # ---------------------------------------------------------------------
    #  Debian'ın fastcgi_params dosyası HTTP_HOST'u "$host" ile geçiriyor —
    #  bilinçli bir güvenlik önlemi: ham "$http_host" istemcinin gönderdiği
    #  Host başlığını olduğu gibi taşır ve mutlak biçimli istek satırıyla
    #  çelişebilir. Ama "$host" PORTU DÜŞÜRÜR.
    #
    #  Sonuç: standart olmayan bir portta çalışan panel, giriş sonrası
    #  "http://198.18.0.20/giris" gibi portsuz bir adrese yönlendirir — port
    #  kaybolduğu için sayfa hiç açılmaz.
    #
    #  nginx 1.30 bunun için "$is_request_port$request_port" değişkenlerini
    #  getirdi; imajdaki 1.22'de yoklar. Aynı şeyi elle kuruyoruz: konak
    #  nginx'in NORMALLEŞTİRDİĞİ "$host"tan, port ise Host başlığından
    #  yalnızca RAKAM olarak alınır. Ham konak adı asla geçmez.
    map $http_host $req_port_suffix {
        default                 "";
        "~^[^:]+:(?<p>[0-9]+)$" ":$p";
    }

    #  Aynı port, iki nokta OLMADAN. X-Forwarded-Port başlığı yalnızca sayı
    #  ister; iki noktayla gönderilirse cihaz adresi bozuk kuruyor.
    map $http_host $req_port_number {
        default                  "443";
        "~^[^:]+:(?<p>[0-9]+)$"  "$p";
    }

    #  CİHAZA İLETİLECEK "Accept-Encoding".
    #
    #  Cihazın HTML sayfasına ayrılış betiği ekleniyor (bkz. interface-proxy.conf)
    #  ve sub_filter sıkıştırılmış gövdeyi göremiyor. Sıkıştırmayı tamamen
    #  kapatmak arayüzü gereksiz yavaşlatırdı; yalnızca SAYFA BELGELERİNDE
    #  kapatılır. Ayrım isteğin kendisinden yapılır: yanıtın türü istek
    #  gönderilirken henüz bilinmiyor, ama tarayıcı ne istediğini söylüyor.
    #
    #  Başlığı göndermeyen eski bir tarayıcıda varsayılan "kapalı"dır: betiğin
    #  eklenmemesi, sayfanın biraz büyük gelmesinden kötüdür.
    map $http_sec_fetch_dest $interface_encoding {
        default      "";
        "~^(empty|script|style|image|font|audio|video|track|worker|manifest|object|embed|report|xslt)$" $http_accept_encoding;
    }

    #  WEBSOCKET YÜKSELTMESİ — yalnızca tarayıcı isterse.
    #
    #  Vekil "Connection" başlığını boş gönderiyor; bu, sıradan istekte DOĞRU
    #  (aksi halde istemcinin "keep-alive"i cihaza olduğu gibi geçer). Ama
    #  tarayıcı websocket açmak istediğinde aynı sabit değer yükseltmeyi
    #  siliyor ve cihaz isteği bir daha yükseltme bekleyerek geri çeviriyor.
    #
    #  vCenter'da: "GET /ws" → 426 Upgrade Required. Sonucu iki yerde görünür
    #  — görev listesi kendiliğinden tazelenmez (sayfa yenilemek gerekir) ve
    #  VM konsolu hiç açılmaz; ikisi de aynı canlı bağlantıdan beslenir.
    #  DEĞER "Upgrade" YAZILIR, "upgrade" DEĞİL.
    #
    #  Başlık değeri kurala göre harfe duyarsız ve nginx'in her örneğinde
    #  küçük harfle yazılır; iLO 4'ün gömülü sunucusu ise harfe BAKIYOR
    #  (konsolun /wss/ircport ucu):
    #
    #      Connection: Upgrade             → 101
    #      Connection: upgrade             → 400
    #      Connection: UPGRADE             → 400
    #      Connection: keep-alive, Upgrade → 101
    #
    #  Belirtisi konsolun "Loading..." ekranında asılı kalmasıdır. Büyük harfli
    #  biçim TARAYICILARIN kendi yazdığı biçimdir; cihaza doğrudan bağlanan
    #  herkes zaten onu gönderiyor, yani hiçbir arayüz için risk taşımaz.
    map $http_upgrade $interface_connection {
        default Upgrade;
        ""      "";
    }

    #  İSTEMCİNİN GERÇEK ADRESİ.
    #
    #  Panel bir ters vekilin (Caddy) arkasında duruyor; ona gelen bağlantının
    #  kaynağı her zaman vekilin kendisidir. Gerçek adres X-Forwarded-For
    #  başlığında geliyor ve $remote_addr onu göstermeyince iki yer yanlış
    #  oluyordu: nginx'in kendi erişim kaydı ve cihaza ilettiğimiz X-Real-IP.
    #  Uygulama tarafında bu zaten çözülüydü (bkz. bootstrap/app.php →
    #  trustProxies); eksik olan nginx tarafıydı.
    #
    #  Liste '*' DEĞİL: X-Forwarded-For'a koşulsuz güvenmek onu YAZILABİLİR
    #  kılar ve kendi adresini yazan biri hız sınırını da denetim kaydını da
    #  atlatırdı. Yalnızca özel ağlar güvenilir; nginx'e zaten başka bir yerden
    #  ulaşılamıyor.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    #  ÖZYİNELEME KAPALI — bilerek.
    #
    #  Açık olsaydı nginx başlığı sağdan sola tarayıp "güvenilir" adresleri
    #  atlar ve ilk güvenilmeyeni alırdı. Ama güvenilir listemizde özel ağlar
    #  var ve kullanıcılar da özel ağda: kendi isteğine
    #  "X-Forwarded-For: 1.2.3.4" yazan biri, Caddy gerçek adresini SONA
    #  eklediği için, nginx'e 1.2.3.4'ü kabul ettirebilirdi.
    #
    #  Kapalıyken nginx başlığın SON değerini alır; oraya adresi Caddy'nin
    #  kendisi yazıyor ve kullanıcı onu etkileyemiyor.
    real_ip_recursive off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
