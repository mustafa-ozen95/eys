# Cihaz arayüzü vekilinin ortak ayarları. Üç konumda da aynısı gerekiyor; tek yerde
# durmazsa biri değişip diğerleri kalır.

# Cihaz sertifikası kendi imzasıdır ve panel onu doğrulayamaz. BU BİR RİSK
# DEĞİL: doğrulamayı kullanıcının tarayıcısı da yapamazdı — doğrudan bağlansa
# aynı uyarıyı görüp geçecekti. Kimlik zaten kasada ve ağ iç ağdır.
proxy_ssl_verify off;
proxy_ssl_server_name on;

# SNI'de CİHAZIN adı durmalı, bağlantı havuzunun adı değil.
#
# proxy_pass artık havuzun adına bakıyor (bkz. aşağıdaki not) ve nginx SNI'yi
# varsayılan olarak oradan alır; cihaza "cihaz_192_0_2_10_443" diye bir sunucu
# adı giderdi. Doğrulama kapalı olduğu için kırılmazdı ama cihazın gördüğü ad
# yanlış olurdu; adı açıkça söylüyoruz.
proxy_ssl_name $arayuz_konak;

# BAĞLANTI HAVUZU: hedef doğrudan değil, havuzun adı üzerinden verilir.
#
# nginx, hedefi bir değişkenden okuyan proxy_pass için bağlantı havuzu tutmuyor;
# her istekte yeni bir TLS el sıkışması yapıyor. Zayıf işlemcili bir BMC'de bu
# tek başına yarım saniyeyi bulabilir ve arayüzün onlarca varlığı yüklenene
# kadar sayfa boş kalır.
#
# Havuzlar kasadan üretiliyor (erisim:interface-pools) ve eşlemenin varsayılanı
# hedefin kendisi: listede olmayan cihaz eskisi gibi, havuzsuz ama ÇALIŞARAK
# bağlanır.

# Host başlığı CİHAZIN adı olmalı: rhttpproxy bazı yanıtları ona göre kuruyor.
proxy_set_header Host $arayuz_hedef;

# ARAYÜZ HEM XHR HEM WEBSOCKET KONUŞUYOR.
#
# Websocket bir süre "yalnızca VM konsolunda gerekir, o da kapsam dışı" diye
# geçilmişti; değil. vSphere Client canlı bağlantıyı iki şey için kullanıyor:
# görev listesi ve VM konsolu. Yükseltme iletilmeyince ikisi de sessizce
# çalışmıyordu — liste ancak sayfa yenilenince doluyor, konsol hiç açılmıyor.
#
# Değeri eşleme veriyor: tarayıcı yükseltme istemediğinde başlık BOŞ kalır
# (sıradan istekte doğrusu bu; istemcinin "keep-alive"i cihaza geçmemeli),
# istediğinde "upgrade" olur ve el sıkışma cihaza olduğu gibi ulaşır.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $arayuz_baglanti;

# CİHAZA GİDECEK ÇEREZ, bekçinin SÜZDÜĞÜ çerezdir.
#
# Varsayılan davranış isteğin "Cookie" başlığını olduğu gibi iletmek olurdu ve
# içinde panelin oturum çerezi de bulunurdu — cihazda işi yok. nginx'in çerez
# süzen bir yönergesi yok, o yüzden süzmeyi bekçi yapıyor: sunucuda açılan
# oturumlarda cihazın KENDİ çerezi, ötekilerde tarayıcınınkilerden yalnızca
# cihaza ait olanlar.
proxy_set_header Cookie $arayuz_cerez;

# SIRRI ÇEREZ DEĞİL BAŞLIK TAŞIYAN ARAYÜZ: Rspamd.
#
# Rspamd'ın oturum kavramı yok; her isteğin "Password" başlığında parolanın
# kendisini bekliyor (ölçüldü, Rspamd 4.1.0: başlıksız /auth 401,
# başlıkla 200 "auth":"ok"). Panel parolayı burada ekler, böylece tarayıcıya
# hiç inmez.
#
# DEĞER BOŞSA NGINX BAŞLIĞI HİÇ GÖNDERMEZ — bu, öteki arayüzlerin isteğine
# anlamsız bir "Password:" satırı eklenmemesini kendiliğinden sağlar.
proxy_set_header Password $arayuz_gizli;

# REFERER VE ORIGIN CİHAZIN KÖKENİNDEN GÖRÜNÜR.
#
# Tarayıcı bu başlıkları kendi yazar ve vekilin kökenini ("erisim...:9443")
# koyar. Bazı arayüzler isteği kendi kökenlerinden gelmiş görmek istiyor:
# DirectAdmin portalı HER istekte bakıyor ve panelin kökenini gördüğünde
# "Referer check has failed" diyor — giriş çalışsa bile içinde gezilemiyordu
# (ölçüldü).
#
# KARAR `if` İLE VERİLEMEZ: nginx `if`/`set` çiftini REWRITE aşamasında
# çalıştırıyor, `auth_request_set` değişkenleri ise ACCESS aşamasından sonra
# doluyor — koşul her zaman boş görüyordu (ölçüldü: başlık hiç değişmedi).
# Eşleme (map) ise değişken ilk KULLANILDIĞINDA çözülüyor, yani vekile
# geçerken; bayrak o an yerinde.
#
# Yalnızca isteyen türde dokunulur (bkz. nginx.conf'taki eşlemeler ve
# InterfaceType::kokenYazilirMi); ötekilerde başlıklar tarayıcının yazdığı gibi
# geçer.
proxy_set_header Referer $vekil_referer;
proxy_set_header Origin $vekil_origin;

# YÖNLENDİRMELER VEKİLDE KALIR.
#
# Cihazlar kendi MUTLAK adreslerine yönlendiriyor (Plesk girişten sonra
# https://<cihaz>:8443/smb/... diyor). Olduğu gibi geçirilirse tarayıcı vekilden
# ÇIKIYOR: oturum artık cihazın kendi kökeninde sürüyor, denetim kaydı kopuyor
# ve köken yalıtımı ortadan kalkıyor (ölçüldü). Konum başlığı
# cihazın adresinden bizimkine çevrilir.
#
# İki biçim de yazılır: cihaz kendi adını portlu da portsuz da kurabiliyor.
# Hedef adres AÇIKÇA yazılır: "/" yazmak yetmiyor.
#
# nginx, yerine koyduğu yolu mutlak adrese tamamlarken şemayı DİNLEYİCİDEN
# alıyor. Bu dinleyici düz HTTP konuşuyor (TLS'i ters vekil bitiriyor), o
# yüzden tarayıcıya "http://erisim...:9443/login.php" gidiyor ve o kapı TLS
# beklediği için "Client sent an HTTP request to an HTTPS server" hatası
# görünüyordu (Plesk'te ölçüldü).
#
# $istek_portu, Host başlığındaki portu getiriyor (bkz. nginx.conf'taki map);
# vekil kökeni ayrı bir portta durduğu için o da adrese girmeli.
#
# YÖNLENDİRME ÖNEKİ DE TAŞIR.
#
# Cihaz kendi köküne yönlendiriyor ("https://kendi-adresim/admin/"); kökeni
# değiştirmek yetmiyor, oturum öneki de eklenmeli. Yoksa tarayıcı önek dışına
# çıkıyor ve oturumu yalnızca çerez taşımaya başlıyor — iki sekmede iki arayüz
# açıkken çakışmanın geri geldiği yer tam burasıydı (ölçüldü: Plesk'in kökü
# 303 ile /admin/ diyor).
#
# Öneki bekçi söylüyor; önek kullanmayan türde (Rspamd) boş gelir ve kurallar
# eskisi gibi çalışır.
auth_request_set $arayuz_onek $upstream_http_x_eys_onek;

# CİHAZ YÖNLENDİRMEYİ BİZİM KÖKENİMİZLE DE KURABİLİYOR.
#
# Ona "X-Forwarded-Host: <panel adı>:9443" gönderiyoruz ve buna bakan arayüzler
# (Plesk) Location'ı doğrudan o kökenle yazıyor — yani cihazın adını arayan
# kurallar hiç eşleşmez ve önek düşer (Plesk'in kökü
# "https://eys.ornek.test:9443/admin/" der, kendi adını hiç anmaz).
#
# Bu kural EN BAŞTA durur; önek zaten varsa cihaz onu görmediği için iki kez
# eklenmesi mümkün değil (vekil öneki proxy_pass'ten önce ayırıyor).
proxy_redirect https://$host$istek_portu/ https://$host$istek_portu$arayuz_onek/;

proxy_redirect https://$arayuz_hedef/ https://$host$istek_portu$arayuz_onek/;
proxy_redirect http://$arayuz_hedef/  https://$host$istek_portu$arayuz_onek/;
proxy_redirect https://$arayuz_konak/ https://$host$istek_portu$arayuz_onek/;
proxy_redirect http://$arayuz_konak/  https://$host$istek_portu$arayuz_onek/;

# GÖRELİ YÖNLENDİRME DE VAR: cihaz "Location: /admin/" diyebiliyor ve yukarıdaki
# kurallar yalnızca mutlak adresleri tanıyor. Bu kural EN SONDA durmalı —
# nginx ilk eşleşen kuralda duruyor ve cihaz bizim önekimizi hiç yazmadığı için
# önek iki kez eklenmez.
proxy_redirect / $arayuz_onek/;

# Çerezlerin yolu da bize göre olmalı; cihaz onları kendi dizinine kısıtlıyor.
proxy_cookie_path / /;
# KULLANICININ ADRESİ CİHAZA DA GİDER.
#
# Vekilin arkasında cihaz, bağlantıyı yapan olarak panelin adresini görüyor;
# kendi kaydında "kim bağlandı" sorusu panelde kalırdı. Gerçek adres üç
# biçimde birden iletilir: yaygın iki başlık ve RFC 7239'un standart olanı.
#
# $remote_addr artık GERÇEK istemcidir (bkz. nginx.conf → real_ip): panel de
# bir ters vekilin arkasında ve o ayar olmadan buraya vekilin adresi yazardı.
#
# Cihazın bunu KAYDA GEÇİRİP GEÇİRMEDİĞİ cihaza kalmış: çoğu yönetim arayüzü
# yalnızca TCP kaynağını yazıyor. Bu yüzden "kim ne yaptı" sorusunun kesin
# cevabı panelin kendi denetim kaydıdır; bu başlıklar onu tamamlar, yerine
# geçmez.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# DIŞARIDAKİ BAĞLANTI HER ZAMAN HTTPS.
#
# $scheme bu dinleyicinin şemasıdır ve "http"dir (TLS'i ters vekil bitiriyor).
# Olduğu gibi iletilince Plesk kendi adreslerini http olarak kuruyor ve
# tarayıcı TLS bekleyen kapıya düz HTTP ile gidip
# "Client sent an HTTP request to an HTTPS server" alıyordu (ölçüldü:
# cihazın verdiği Location zaten http://...:9443/login.php idi).
#
# Konak da açıkça söylenir: arayüz kendi adresini bununla kuruyor ve vekil
# kökeni ayrı bir portta durduğu için port da girmeli.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host$istek_portu;
proxy_set_header X-Forwarded-Port $istek_portu_sayi;
proxy_set_header Forwarded "for=$remote_addr;proto=$scheme";

# Host Client vekile hangi cihazı istediğini bu başlıkla söyler; bekçi onu
# doğruladı, cihaza taşımaya gerek yok ama zarar da vermez — cihaz yok sayar.

# AYRILIŞ HABERİ CİHAZIN SAYFASINA EKLENİR.
#
# Cihazda açtığımız oturumu cihazda kapatmak bize düşüyor ve bunun için
# "kullanıcı gitti" haberini almak gerekiyor. ESXi ile VAMI'de sayfayı panel
# verdiği için betiği oraya koyabiliyoruz; Plesk ve iLO'da sayfa doğrudan
# cihazdan geçiyor ve araya panel giremiyor (girseydi cihazın kendi
# yönlendirmesini yutardı). Kalan tek yer yanıtın kendisi.
#
# Betik yalnızca EN ÜST pencerede iş yapar (bkz. page-leave.blade.php).
#
# ADRESTE OTURUM VAR: betik hangi oturumda olduğunu böyle biliyor. Oturumu
# ÇEREZDEN bulsaydı iki sekmede iki arayüz açıkken yanlış oturumu
# bulabilirdi; üstelik adres çubuğunu öneke geri yazma işi ancak oturumu
# kesin bilerek yapılabilir.
auth_request_set $arayuz_oturum $upstream_http_x_eys_oturum;
sub_filter '</head>' '<script src="/cihaz-oturum/$arayuz_oturum/acilis.js"></script></head>';

# REFERER'I CİHAZ KISAMAZ.
#
# Önekin dışına düşen MUTLAK isteklerde oturumu Referer söylüyor. Cihaz kendi
# yanıtına "Referrer-Policy: no-referrer" (ya da origin) koyarsa tarayıcı yolu
# göndermiyor ve oturum yine çereze düşüyor — yani iki sekme çakışıyor.
#
# Başlık burada BİZİM koyduğumuzla değiştiriliyor. "unsafe-url" adı ürkütücü
# ama kapsamı yalnızca bu köken: adres zaten panelin kendi adresi ve dışarıya
# hiç gitmiyor; cihazın adresi tarayıcıya zaten görünmüyor.
proxy_hide_header Referrer-Policy;
add_header Referrer-Policy "unsafe-url" always;

# CİHAZIN KENDİ <base> ETİKETİ ÖNEĞİ SİLİYORDU.
#
# vSphere'in sayfası "<base href="/ui/">" yazıyor; bu, bütün göreli adresleri
# önekin DIŞINA — cihazın kök yoluna — çekiyor. Oturum yine çereze düşüyor,
# iki sekmede çakışma geri geliyor ve kullanıcı giriş ekranına atılıyordu
# (ölçüldü: /cihaz/ornek-cihaz/ sayfasının gövdesinde bu etiket var).
#
# Yeni değeri bekçi hesaplıyor: önek varsa önek, yoksa cihazın kendi taban
# dizini — yani öneksiz kipte hiçbir şey değişmiyor.
auth_request_set $arayuz_base $upstream_http_x_eys_base;
sub_filter '<base href="/ui/">' '<base href="$arayuz_base">';
# Bir kez: sayfada tek betik yeter.
#
# "sub_filter_types text/html" YAZILMAZ: text/html zaten her zaman kapsam
# içinde ve ayrıca yazmak nginx'e her yeniden yüklemede "duplicate MIME type"
# uyarısı verdiriyor.
sub_filter_once on;

# Yanıt gövdesi olduğu gibi geçmeli: sıkıştırılmış gövdeyi değiştirmiyoruz,
# ama Accept-Encoding'i kapatmak arayüzü gereksiz yere yavaşlatırdı.
#
# TEK İSTİSNA HTML BELGELERİ: sub_filter sıkıştırılmış gövdeyi göremiyor.
# Ayrım isteğin kendisinden yapılır (Sec-Fetch-Dest: document), çünkü yanıtın
# türü istek gönderilirken henüz bilinmiyor. Böylece sıkıştırma yalnızca
# sayfa belgelerinde kapanıyor; betikler, biçemler ve resimler sıkışık geçiyor.
proxy_set_header Accept-Encoding $arayuz_kodlama;

proxy_buffering off;

# Host Client "uzun yoklama" (longPoll) ile değişiklikleri bekliyor: bağlantı
# dakikalarca açık ve SESSİZ kalır. Kısa bir zamanaşımı onu koparır ve arayüz
# donuk görünür.
proxy_read_timeout 600s;
proxy_send_timeout 600s;
