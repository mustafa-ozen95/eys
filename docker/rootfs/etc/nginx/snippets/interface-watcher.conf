# Bekçi ve ayna konumları. İKİ dinleyicide de gerekiyor (panelin kökeni ve
# cihaz arayüzü kökeni); tek dosyada durmazsa biri değişip diğeri kalır.

    # BEKÇİ VE AYNA DIŞARIDAN ÇAĞRILAMAZ.
    # Laravel'de bu iki uç "auth" dışında ve yanıtlarında cihaz sırları
    # (X-Eys-Secret, X-Eys-Cookie) var; yalnızca nginx'in iç alt istekleri
    # (auth_request / mirror, aşağıdaki "internal" konumlar) çağırmalı. Burada
    # kapatılmasa tarayıcıdan doğrudan çağrılıp başlıklardaki sır okunabilirdi.
    # İç konumlar fastcgi_pass ile doğrudan PHP'ye gider,
    # bu konuma uğramazlar.
    location ^~ /ajax/device-session/ {
        return 404;
    }

    # Aynanın gittiği yer: gövdeyi okuyup SOAP yöntem adını kayda geçirir.
    location = /interface-trace {
        internal;

        fastcgi_pass unix:/run/php/eys.sock;

        fastcgi_param GATEWAY_INTERFACE  CGI/1.1;
        fastcgi_param SERVER_SOFTWARE    nginx;
        fastcgi_param SERVER_PROTOCOL    $server_protocol;
        fastcgi_param SERVER_NAME        $server_name;
        fastcgi_param SERVER_ADDR        $server_addr;
        fastcgi_param SERVER_PORT        443;
        fastcgi_param REMOTE_ADDR        $remote_addr;
        fastcgi_param REMOTE_PORT        $remote_port;
        fastcgi_param REQUEST_METHOD     POST;
        fastcgi_param CONTENT_TYPE       $content_type;
        fastcgi_param CONTENT_LENGTH     $content_length;
        fastcgi_param DOCUMENT_ROOT      $document_root;
        fastcgi_param SCRIPT_FILENAME    $document_root/index.php;
        fastcgi_param SCRIPT_NAME        /index.php;
        fastcgi_param DOCUMENT_URI       /ajax/device-session/watch;
        fastcgi_param REQUEST_URI        /ajax/device-session/watch;
        fastcgi_param QUERY_STRING       "";

        fastcgi_param HTTP_X_VSPHERE_PROXY $http_x_vsphere_proxy;
        fastcgi_param HTTP_COOKIE          $http_cookie;
        fastcgi_param HTTPS                on;
        fastcgi_param HTTP_HOST            $host$req_port_suffix;
    }

    # --- Uzak oturum bekçisi --------------------------------------------------
    # Yalnızca nginx'in kendi alt isteğiyle çağrılır.
    #
    # fastcgi_params burada BİLEREK include edilmez: içindeki REQUEST_URI
    # istemcinin özgün adresini taşır, alt isteğininkini değil. Include
    # edilirse Laravel /ssh-proxy/7501/ adresini arayıp 404 döner ve nginx
    # bunu 500'e çevirir.
    location = /remote-session-guard {
        internal;

        fastcgi_pass unix:/run/php/eys.sock;

        fastcgi_param GATEWAY_INTERFACE  CGI/1.1;
        fastcgi_param SERVER_SOFTWARE    nginx;
        fastcgi_param SERVER_PROTOCOL    $server_protocol;
        fastcgi_param SERVER_NAME        $server_name;
        fastcgi_param SERVER_ADDR        $server_addr;
        fastcgi_param SERVER_PORT        443;
        fastcgi_param REMOTE_ADDR        $remote_addr;
        fastcgi_param REMOTE_PORT        $remote_port;
        fastcgi_param REQUEST_METHOD     GET;
        fastcgi_param CONTENT_TYPE       "";
        fastcgi_param CONTENT_LENGTH     "";
        fastcgi_param DOCUMENT_ROOT      $document_root;
        fastcgi_param SCRIPT_FILENAME    $document_root/index.php;
        fastcgi_param SCRIPT_NAME        /index.php;
        fastcgi_param DOCUMENT_URI       /ajax/remote-session/verify;
        fastcgi_param REQUEST_URI        /ajax/remote-session/verify;
        fastcgi_param QUERY_STRING       "";

        # Hangi portun sorulduğunu bekçi bu başlıktan okur; alt istekte
        # değişken taşımak güvenilir değil.
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_param HTTPS              on;
        # Aynı sebeple ham $http_host değil; bkz. nginx.conf'taki map.
        fastcgi_param HTTP_HOST          $host$req_port_suffix;
    }

    # --- Cihaz arayüzü vekilinin bekçisi -----------------------------------------------
    # Uzak oturum bekçisiyle aynı gerekçeyle elle kurulur (fastcgi_params
    # include EDİLMEZ: içindeki REQUEST_URI istemcininkini taşır).
    #
    # Farkı: hedefi de bu uç söylüyor (X-Eys-Target) ve bunun için hem istemcinin
    # özgün adresini hem x-vsphere-proxy başlığını hem de oturum çerezini
    # görmesi gerekiyor.
    location = /arayuz-bekcisi {
        internal;

        fastcgi_pass unix:/run/php/eys.sock;

        fastcgi_param GATEWAY_INTERFACE  CGI/1.1;
        fastcgi_param SERVER_SOFTWARE    nginx;
        fastcgi_param SERVER_PROTOCOL    $server_protocol;
        fastcgi_param SERVER_NAME        $server_name;
        fastcgi_param SERVER_ADDR        $server_addr;
        fastcgi_param SERVER_PORT        443;
        fastcgi_param REMOTE_ADDR        $remote_addr;
        fastcgi_param REMOTE_PORT        $remote_port;
        fastcgi_param REQUEST_METHOD     GET;
        fastcgi_param CONTENT_TYPE       "";
        fastcgi_param CONTENT_LENGTH     "";
        fastcgi_param DOCUMENT_ROOT      $document_root;
        fastcgi_param SCRIPT_FILENAME    $document_root/index.php;
        fastcgi_param SCRIPT_NAME        /index.php;
        fastcgi_param DOCUMENT_URI       /ajax/device-session/verify;
        fastcgi_param REQUEST_URI        /ajax/device-session/verify;
        fastcgi_param QUERY_STRING       "";

        fastcgi_param HTTP_X_ORIGINAL_URI  $request_uri;
        fastcgi_param HTTP_X_VSPHERE_PROXY $http_x_vsphere_proxy;
        fastcgi_param HTTP_COOKIE          $http_cookie;
        fastcgi_param HTTPS                on;
        fastcgi_param HTTP_HOST            $host$req_port_suffix;
    }
