; Konteynerin süreç yöneticisi. PID 1 budur.
;
; Hangi servisin çalışacağı SABİT DEĞİLDİR: veritabanı dışarıdan verilmişse
; içerideki karşılığı hiç başlatılmaz, Guacamole ise yalnızca sırrı verilmişse
; kalkar. Kararı eys-entrypoint verir ve conf.d altına ilgili dosyayı bırakır.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

; --- Web ---------------------------------------------------------------------
[program:php-fpm]
command = /usr/sbin/php-fpm%(ENV_PHP_VERSION)s --nodaemonize --fpm-config /etc/php/%(ENV_PHP_VERSION)s/fpm/php-fpm.conf
priority = 20
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 25
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Cihaz bağlantı havuzları ------------------------------------------------
; Vekil, hedefi bir DEĞİŞKENDEN okuyor ve nginx böyle bir hedefe bağlantı havuzu
; tutmuyor: her isteğe yeni TLS el sıkışması. Zayıf işlemcili bir BMC'de bu tek
; başına yarım saniye ve arayüz açılmıyor gibi görünüyor (gerekçe:
; ArayuzHavuzlariCommand). Havuzlar kasadan üretiliyor.
;
; Açılışta dosyayı eys-entrypoint yazıyor; bu süreç yalnızca SONRADAN eklenen
; cihazlar için: listeyi tazeleyip değiştiyse nginx'i yeniliyor. Olmasaydı yeni
; bir cihaz bir sonraki açılışa kadar sessizce yavaş kalırdı.
;
; root çalışır: /etc/nginx root'undur ve nginx'i yenileyebilmeli.
[program:arayuz-havuzlari]
command = /usr/local/bin/arayuz-havuzlari izle
priority = 26
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Kuyruk ------------------------------------------------------------------
; Parola döndürme, döndürme onarımı ve etkinlik zinciri doğrulaması buradan
; geçer. Üçü de ShouldBeUnique: aynı kayıt için ikinci iş kuyruğa GİRMEZ, bu
; yüzden tek işçi yeterlidir ve ikinci bir işçi yarış doğurmaz.
;
; --tries=1: uzak sunucuya parola yazmak kör tekrar edilmez. Yarıda kalmış bir
; döndürmeye ikinci kez yazmak, panelin bilmediği bir parolaya yazmaktır;
; onarım akışı (RepairRotationJob) bunun için var.
[program:isci]
command = /usr/bin/php artisan queue:work --queue=default --tries=1 --timeout=300 --max-time=3600 --sleep=1
directory = /uygulama
user = eys
priority = 30
autorestart = true
stopwaitsecs = 310
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Yeniden başlatma ----------------------------------------------------------
; Panel veritabanını taşımak için konteynerin yeniden başlamasını ister; panel
; kullanıcısı bu sokete erişemediği için isteği root olarak bu döngü yerine
; getirir (bkz. dc-yeniden-baslat).
[program:yeniden-baslat]
command = /usr/local/bin/dc-yeniden-baslat
priority = 40
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Zamanlayıcı -------------------------------------------------------------
; cron yerine schedule:work (routes/console.php):
;   - kimlik eşitleme (5 dk): merkezde erişimi kalkan burada da kaybetsin
;   - güncelleme kontrolü (06:50): yalnızca bakar
;   - konsol temizliği (1 dk): tarayıcısı çöken oturumun kapanışı yazılsın
;
; Konteyner dışında cron satırı unutulabilir; konteynerde unutulacak bir yer yok.
[program:zamanlayici]
command = /usr/bin/php artisan schedule:work
directory = /uygulama
user = eys
priority = 31
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
